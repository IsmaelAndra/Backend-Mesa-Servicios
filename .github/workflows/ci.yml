name: CI backend

on:
  push:
    branches: [main, desarrollo]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # Incluye las pruebas *IT: el runner tiene Docker, así que Testcontainers
      # levanta un PostgreSQL real y valida migraciones, mapeo JPA y consultas.
      - name: Pruebas
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test jacocoTestReport

      - name: Informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
