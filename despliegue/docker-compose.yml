# ==============================================================================
# Mesa de Servicios COAC: CONSTRUIR las imágenes (y probarlas) en tu PC
# ==============================================================================
# Construye backend y frontend con el nombre con el que se publican en GitHub
# Container Registry (GHCR), para luego subirlas con "docker compose push".
# En el servidor NO se usa este archivo: allí va docker-compose.prod.yml, que
# descarga esas mismas imágenes.
#
#   cd Backend-Mesa-Servicios/despliegue
#   docker compose build                 # construye las dos imágenes
#   docker compose up -d                 # (opcional) prueba en http://localhost:8088
#   docker compose push backend frontend # las sube a GHCR
#
# Los dos repositorios tienen que estar uno al lado del otro:
#   GitHub/
#   ├── Backend-Mesa-Servicios/despliegue/   ← aquí: este archivo y su .env
#   └── Frontend-Mesa-Servicios/
#
# Guía completa: README.md (en esta carpeta).
# ==============================================================================

name: mesa-servicios

# Los logs de Docker crecen sin límite si no se rotan.
x-logs: &logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mesa_ayuda_coac}
      POSTGRES_USER: ${DB_USERNAME:-mesa_ayuda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      TZ: America/Guayaquil
      PGTZ: America/Guayaquil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [datos]
    logging: *logs

  backend:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/${GHCR_OWNER:-ismaelandra}/mesa-servicios-backend:${VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      # Fijos para este despliegue: no dependen del .env.
      DB_HOST: db
      DB_PORT: "5432"
      SPRING_PROFILES_ACTIVE: prod
      UPLOAD_DIR: /app/uploads
      # Solo el Nginx del frontend llega al backend, y sobrescribe X-Forwarded-For.
      APP_TRUST_FORWARDED_HEADERS: "true"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks: [datos, app]
    logging: *logs

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../Frontend-Mesa-Servicios}
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/${GHCR_OWNER:-ismaelandra}/mesa-servicios-frontend:${VERSION:-dev}
    restart: unless-stopped
    environment:
      REAL_IP_FROM: ${REAL_IP_FROM:-172.16.0.0/12}
    # Solo para probar en tu PC, y solo en 127.0.0.1 (nadie de la red lo ve).
    # En el servidor no se publica ningún puerto (docker-compose.prod.yml).
    ports:
      - "127.0.0.1:${HTTP_PORT_LOCAL:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    logging: *logs

networks:
  # Solo backend y base de datos, sin salida a internet: PostgreSQL no se ve
  # desde ningún otro sitio.
  datos:
    internal: true
  # Backend y frontend. El backend sale a internet por aquí (Microsoft Graph, IA).
  app: {}

# Datos persistentes. "docker compose down" NO los borra; "down -v" sí.
volumes:
  pgdata:
  uploads:
  logs:
