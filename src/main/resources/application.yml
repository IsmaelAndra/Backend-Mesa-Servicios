server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mesa-ayuda-backend

  # ============================ BASE DE DATOS ============================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:mesa_ayuda_coac}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: MesaAyudaHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Si otra sesion (por ejemplo un DBeaver con una transaccion abierta)
      # tiene tomado un lock sobre una tabla, no esperar indefinidamente:
      # se falla rapido para que el arranque termine con un error claro.
      connection-init-sql: SET lock_timeout = '10s'

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Guayaquil

  # El esquema lo gestiona Flyway (db/migration). Spring ya no ejecuta scripts.
  sql:
    init:
      mode: never

  # ============================ MIGRACIONES (Flyway) ============================
  # V1__esquema_base.sql es el antiguo schema.sql (idempotente) y R__datos_base.sql
  # el antiguo data.sql (se reaplica cuando cambia su contenido).
  #
  # baseline-version 0: en una base que ya existía sin historial, Flyway la marca
  # en la versión 0 y aplica igualmente V1. Como V1 es idempotente, completa lo
  # que le falte sin tocar lo que ya hay. Con baseline 1 se saltaría V1 y una
  # base desfasada se quedaría sin los últimos cambios.
  #
  # Los cambios de esquema nuevos van en V2__..., V3__...: una migración ya
  # aplicada NO se edita (Flyway valida su checksum y no arrancaría).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Base existente antes de Flyway
    validate-on-migrate: true
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# ============================ APP (Schedulers, JWT, Uploads, CORS) ============================
app:
  # Telefonía (central Grandstream UCM, ver puente-telefonia/). El puente se
  # identifica con este token (mínimo 32 caracteres). Vacío = telefonía apagada.
  telefonia:
    puente-token: ${TELEFONIA_PUENTE_TOKEN:}
  scheduler:
    sla:
      cron: 0 */15 * * * MON-FRI
    notifications:
      cron: 0 */5 * * * *
    evaluation:
      cron: 0 0 6 1 * *
    graph-sync:
      fixed-delay: 600000
    daily-summary:
      cron: 0 0 8 * * *
  daily-summary:
    # Lista separada por comas; vacío = enviar a ADMIN y SUPER_ADMIN activos
    recipients: ${DAILY_SUMMARY_RECIPIENTS:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000}
  # ============================ CUENTA INICIAL (SUPER_ADMIN) ============================
  # Solo se siembra el SUPER_ADMIN; el resto de cuentas las crea el desde la app.
  # Si ADMIN_SEED_PASSWORD viene vacia NO se crea ninguna cuenta administrativa.
  # En produccion hay que definirla en el primer arranque (o dar de alta al
  # SUPER_ADMIN a mano). La cuenta nace con mustChangePassword=TRUE, asi que
  # el unico uso de esa clave es obligar a cambiarla.
  admin-seed:
    password: ${ADMIN_SEED_PASSWORD:}
    superadmin-email: ${ADMIN_SEED_EMAIL:superadmin@coacmagisterio.fin.ec}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  # Base de la API; se usa para construir URLs de archivos y del logo.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080/api}
  # Base del frontend; es la que deben usar los enlaces de los correos, porque
  # public-base-url apunta a la API y un usuario no puede usarla para navegar.
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}

  # proxy, auth, mail y workflow estaban sangrados dentro de "management:" y
  # Spring nunca los leía: app.proxy.trust-forwarded-headers valía siempre false
  # y, detrás de Nginx, todos los usuarios compartían la IP del proxy en los
  # límites de intentos.
  proxy:
    # Hay que ponerlo a true SOLO si todas las peticiones llegan por un proxy
    # (Nginx, IIS, balanceador). Con false se ignora X-Forwarded-For y la IP de los
    # limites es la conexion directa, que es lo correcto en desarrollo.
    # Con true y el backend expuesto a internet, cualquiera puede inventarse la IP.
    trust-forwarded-headers: "${APP_TRUST_FORWARDED_HEADERS:false}"

  auth:
    # La cookie de sesión (refresh token) debe llevar Secure en producción con HTTPS.
    # En false solo funciona en http://localhost: el navegador rechaza una cookie Secure
    # que no venga por HTTPS, y sin esto no se podría iniciar sesión en desarrollo.
    secure-cookie: "${APP_SECURE_COOKIE:false}"

  mail:
    outbox:
      # Cola de correo (V10). Exchange Online limita cada buzón a unos 30
      # mensajes por minuto: se deja margen. Subirlo provoca 429 de Graph.
      max-por-minuto: 25
      lote: 20
      # Desde cuántos avisos pendientes para una misma persona se mandan juntos.
      agrupar-desde: 4
      max-intentos: 6
      intervalo-ms: 5000
      retencion-dias: 30
  workflow:
    # Motor de workflows. Los limites se REVISTEN antes de produccion: son la
    # unica red de seguridad contra automatizaciones que se realimentan.
    enabled: true
    max-pasos: 200
    max-profundidad: 5
    max-horas-ejecucion: 168
    max-ejecuciones-por-hora: 60
    max-ejecuciones-simultaneas: 5
    max-ejecuciones-concurrentes: 10
    threads: 2
    max-reintentos: 1
    minutos-ejecucion-abandonada: 30
    minutos-deduplicacion: 1440
    dias-retencion-ejecuciones: 90
    intervalo-worker: 1000

# ============================ MICROSOFT GRAPH (Outlook) ============================
microsoft:
  graph:
    client-id: ${MS_CLIENT_ID:}
    client-secret: ${MS_CLIENT_SECRET:}
    tenant-id: ${MS_TENANT_ID:}

# ============================ JASPER REPORTS ============================
jasper:
  reports-dir: classpath:/reports

# ============================ SWAGGER ============================
# Apagado por defecto: si se arranca sin perfil, o con un perfil que no sea
# "prod", no debe quedar el mapa completo de la API publicado. Lo enciende el
# perfil "dev" o la variable SWAGGER_ENABLED=true.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs

# ============================ LOGGING ============================
logging:
  level:
    root: INFO
    com.mesaayuda: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
  file:
    name: logs/mesa-ayuda.log
    max-size: 10MB
    max-history: 10

# ============================ MANAGEMENT ============================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
